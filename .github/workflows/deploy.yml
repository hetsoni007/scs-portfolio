name: Deploy

# Builds the site and publishes dist/ to the S3 bucket behind
# portfolio.soniconsultancyservices.com, then invalidates CloudFront.
# Setup (repo Settings → Secrets and variables → Actions) is in README.md → Deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      HAS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
      HAS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Check deploy settings
        run: |
          missing=""
          [ "$HAS_KEY_ID" = "true" ] || missing="$missing secret:AWS_ACCESS_KEY_ID"
          [ "$HAS_SECRET" = "true" ] || missing="$missing secret:AWS_SECRET_ACCESS_KEY"
          [ -n "$S3_BUCKET" ] || missing="$missing variable:S3_BUCKET"
          [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ] || missing="$missing variable:CLOUDFRONT_DISTRIBUTION_ID"
          if [ -n "$missing" ]; then
            echo "::error::Deploy is not configured. Missing:$missing (see README.md → Deploy)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          # 1. Content-hashed bundles: cache for a year. Old ones are kept so a tab
          #    that loaded the previous version can still fetch its lazy chunks.
          aws s3 sync dist/assets "s3://$S3_BUCKET/assets" \
            --cache-control "public,max-age=31536000,immutable"
          # 2. Everything else except the HTML shell. --delete removes files that
          #    no longer exist (assets/ and index.html are excluded from deletion).
          aws s3 sync dist "s3://$S3_BUCKET" --delete \
            --exclude "assets/*" --exclude "index.html" \
            --cache-control "public,max-age=86400"
          # 3. The shell last and uncached, so it only ever references bundles
          #    that are already in the bucket.
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*" \
            --query 'Invalidation.Id' --output text
